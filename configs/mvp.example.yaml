# Paths are resolved relative to this YAML file.
method: ours                 # ours | dc | full_sh | pbr_only
workspace_root: ../..
scene: 3DGS-RTMaterial:bicycle
legacy_root: ../../3DGS-RTMaterial-clean-validation
# model_path/source_path/images/resolution/background are read from the
# selected sibling scene's cfg_args. Leave them empty unless overriding it.
model_path: ""
source_path: ""
images: images
resolution: -1
white_background: false
project_state: /absolute/path/to/gui_project_state.npz  # also accepts precomputed_mask.pt
segment_id: 1               # one-based segment id shown by the existing GUI
reference_image: /absolute/path/to/style_reference.jpg
dino_checkpoint: /absolute/path/to/dino_vitbase8_pretrain.pth
environment_dir: /absolute/path/to/hdr_directory
output_dir: ../outputs/ours

train:
  iterations: 2000
  learning_rate: 0.01
  texture_learning_rate: 0.002
  albedo_mode: replacement
  seed: 42
  sh_degree: 1              # low-dimensional residual: (degree + 1)^2 coefficients
  residual_limit: 0.08
  global_shift_limit: 0.7
  detail_residual_limit: 0.08
  texture_resolution: 512   # packed atlas resolution (tri-planar uses this per plane)
  texture_logit_limit: 4.0
  texture_mapping: atlas    # atlas | triplanar | planar
  reference_layout: saliency_grid # full | saliency_grid | saliency_focus | saliency_tile | saliency_motifs
  reference_saliency_patches: 4   # deterministic global/mid/fine crops
  reference_focus_scale: 0.32     # crop size for saliency_focus/saliency_tile
  reference_tile_count: 3         # repeats per axis for saliency_tile
  reference_metric_tiles: true    # compensate planar world-space aspect ratio
  style_patch_reference: original # original keeps paired methods comparable
  atlas_charts: 8
  atlas_neighbours: 8
  atlas_padding: 4
  atlas_feather: 0.15
  atlas_uv_offset_limit: 0.03
  atlas_source_layout: packed     # packed | developed | component | chart | projected
  atlas_reference_repeat: 1       # explicit texture scale; 1 keeps the full reference
  texture_init_strength: 1.0
  texture_stage_iterations: 1200
  image_size: 224
  preview_every: 100
  checkpoint_every: 500
  graph_anchors: 512
  graph_neighbours: 8
  graph_scope: appearance   # appearance | material (legacy roughness/metallic only)
  min_segment_coverage: 0.005 # reject views where the segment has too few style patches
  random_hdr: true
  render_mode: pbr              # pbr, diffuse_only, or albedo
  albedo_only_render: false     # Diagnostic mode: bypass PBR/HDR and render albedo directly
  random_exposure_min: -1.0
  random_exposure_max: 1.0
  pbr_diffuse_white: 1.0
  pbr_exposure: 0.0
  pbr_white_point: 1.0

losses:
  style: 1.0
  patch_style: 2.0          # DINO NNFM + 96/160/224 RGB patch matching
  content: 0.5
  graph: 0.05
  outside: 10.0
  boundary_outside: 5.0
  material_prior: 0.01
  hdr_consistency: 0.5       # same camera, two HDRs, normalized local structure
  texture_anchor: 0.2        # keep the learned field near the reference initialization
  texture_delta_tv: 0.05     # suppress sparse-view noise in texture updates
  color_mean: 2.0            # absolute RGB + Lab mean match on UV albedo
  render_color: 2.0          # post-PBR RGB + Lab mean match in segment ROI
  uv_continuity: 0.01        # Atlas-only: smooth trainable UV corrections
  uv_distortion: 0.02        # Atlas-only: retain local metric scale
  chart_seam: 0.05           # Atlas-only: match appearance across chart boundaries
  uv_foldover: 0.05          # Atlas-only: preserve local triangle orientation
  uv_collision: 0.05         # Atlas-only: separate distant surfaces in UV

evaluation:
  max_views: 12
  heldout_env_count: 3

function videoMarkup(items){if(!items?.length)return'';return `<div class="section"><h3 class="section-title">Continuous orbits</h3><div class="video-grid">${items.map(item=>`<figure><video src="${esc(item.src)}" controls preload="metadata"></video><figcaption>${esc(item.title)}</figcaption></figure>`).join('')}</div></div>`}
function browserMarkup(groups,stageIndex){if(!groups?.length)return'';return `<div class="section"><h3 class="section-title">Complete result browser</h3><div class="panel result-browser" data-stage="${stageIndex}"><div class="browser-controls"><select aria-label="Result collection">${groups.map((g,i)=>`<option value="${i}">${esc(g.label)} · ${g.items.length}</option>`).join('')}</select><button type="button" data-dir="-1" aria-label="Previous result">←</button><button type="button" data-dir="1" aria-label="Next result">→</button></div><div class="browser-stage"></div><input class="browser-range" type="range" min="0" max="0" value="0" aria-label="Result index"><div class="browser-meta"><span class="browser-name"></span><span class="browser-count"></span></div></div></div>`}
function stageMarkup(stage,index){return `<section class="stage" id="${esc(stage.id)}" data-index="${index}"><div class="stage-head"><div><div class="eyebrow">Phase ${esc(stage.number)}</div><h2>${esc(stage.title)}</h2><div class="subtitle">${esc(stage.subtitle)}</div><p class="summary">${esc(stage.summary)}</p></div><span class="status ${esc(stage.status)}">${esc(stage.statusLabel)}</span></div><div class="metrics">${stage.metrics.map(m=>`<div class="metric"><div class="label">${esc(m[0])}</div><div class="value">${esc(m[1])}</div><div class="detail">${esc(m[2])}</div></div>`).join('')}</div>${tableMarkup(stage.table)}${tableMarkup(stage.secondaryTable)}${pairMarkup(stage.pair)}${galleryMarkup(stage.gallery)}${videoMarkup(stage.videos)}${browserMarkup(stage.collections,index)}${stage.note?`<div class="note">${esc(stage.note)}</div>`:''}<div class="section"><h3 class="section-title">Reports and data</h3><div class="links">${stage.links.map(link=>`<a href="${esc(link.href)}" target="_blank">${esc(link.label)} ↗</a>`).join('')}</div></div></section>`}
$('#content').innerHTML=DATA.stages.map(stageMarkup).join('');
$('#nav').innerHTML=DATA.stages.map((s,i)=>`<button data-index="${i}"><span class="n">${esc(s.number)}</span><span class="t">${esc(s.title)}</span></button>`).join('');
function activate(index,push=true){const stage=DATA.stages[index];$$('.stage').forEach((x,i)=>x.classList.toggle('active',i===index));$$('#nav button').forEach((x,i)=>x.classList.toggle('active',i===index));$('#currentTitle').textContent=`${stage.number} · ${stage.title}`;$('#currentSub').textContent=stage.subtitle;$('#sidebar').classList.remove('open');if(push)history.replaceState(null,'',`#${stage.id}`);window.scrollTo(0,0)}
$$('#nav button').forEach(btn=>btn.addEventListener('click',()=>activate(+btn.dataset.index)));
$('#menu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
$$('.compare').forEach(box=>{const input=$('input',box),after=$('.after',box),divider=$('.divider',box);input.addEventListener('input',()=>{after.style.clipPath=`inset(0 ${100-input.value}% 0 0)`;divider.style.left=`${input.value}%`})});
function setupBrowser(browser){const stage=DATA.stages[+browser.dataset.stage],groups=stage.collections,select=$('select',browser),range=$('.browser-range',browser),frame=$('.browser-stage',browser),name=$('.browser-name',browser),count=$('.browser-count',browser);let group=0,index=0;function draw(){const items=groups[group].items,item=items[index];range.max=Math.max(0,items.length-1);range.value=index;frame.innerHTML=item.kind==='video'?`<video src="${esc(item.src)}" controls preload="metadata"></video>`:`<img src="${esc(item.src)}" alt="${esc(item.name)}">`;name.textContent=item.name;count.textContent=`${index+1} / ${items.length}`}select.addEventListener('change',()=>{group=+select.value;index=0;draw()});range.addEventListener('input',()=>{index=+range.value;draw()});$$('button',browser).forEach(btn=>btn.addEventListener('click',()=>{const n=groups[group].items.length;index=(index+(+btn.dataset.dir)+n)%n;draw()}));draw()}
$$('.result-browser').forEach(setupBrowser);
const modal=$('#modal'),modalImage=$('img',modal);$$('.media-card img').forEach(img=>img.addEventListener('click',()=>{modalImage.src=img.src;modal.classList.add('open')}));function closeModal(){modal.classList.remove('open');modalImage.removeAttribute('src')}modal.addEventListener('click',e=>{if(e.target===modal||e.target.tagName==='BUTTON')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const initial=Math.max(0,DATA.stages.findIndex(s=>`#${s.id}`===location.hash));activate(initial,false);requestAnimationFrame(()=>window.scrollTo(0,0));
</script>
</body>
</html>
